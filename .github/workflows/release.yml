name: Release

# Cut a verifiable .ehpk straight from source whenever a v* tag is pushed, and
# publish it as a GitHub Release. No hand-built binaries: every artifact is
# produced by CI and ships with a SHA-256 checksum plus a signed build-provenance
# attestation, so users can confirm it really came from this repo's CI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual re-run / smoke test

permissions:
  contents: write # create the GitHub Release and upload the artifact
  id-token: write # sign the build-provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the packaged manifest in sync with the tag so the .ehpk
      # self-describes the exact release it was cut from. Runs after
      # `npm ci` so the committed lockfile is used unchanged.
      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm pkg set "version=${VERSION}"
          jq --arg v "${VERSION}" '.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json

      - name: Type-check and build
        run: npm run build

      - name: Package the .ehpk
        run: npm run pack

      - name: Write SHA-256 checksum
        run: sha256sum eurofurence-hud.ehpk > eurofurence-hud.ehpk.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: eurofurence-hud.ehpk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eurofurence-hud.ehpk
            eurofurence-hud.ehpk.sha256
          body: |
            ## Eurofurence HUD **v${{ steps.version.outputs.version }}**

            Built automatically from source at tag `${{ github.ref_name }}` by GitHub Actions.

            **Verify the artifact**
            - Confirm `eurofurence-hud.ehpk` matches the checksum in `eurofurence-hud.ehpk.sha256`.
            - Check the **build-provenance attestation** attached to this release to prove it was built from this repo's CI.
